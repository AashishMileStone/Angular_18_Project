<h2 class="mt-3">User List</h2>
<div class="getapi-table mt-3">
<table border="1" width="100%" class="table table-bordered">
  <tr class="thead-dark">
    <th>ID</th>
    <th>Name</th>
    <th>Username</th>
    <th>Email</th>
    <th class="action-column">Actions</th>
  </tr>

  <tr *ngFor="let user of users; let i = index">
    <td>{{ i + 1}}</td>
    <td>{{user.name}}</td>
    <td>{{user.username}}</td>
    <td>{{user.email}}</td>
    <td class="action-column">
      <button class="btn btn-success mx-2" (click)="editUser(user)">Edit</button>
      <button class="btn btn-danger" (click)="deleteUser(user.id!)">Delete</button>
    </td>
  </tr>
</table>
</div>

<hr>

<h3>Add User</h3>

<input [(ngModel)]="newUser.name" placeholder="Name" class="mx-2">
<input [(ngModel)]="newUser.username" placeholder="Username" class="mx-2">
<input [(ngModel)]="newUser.email" placeholder="Email" class="mx-2">
<button class="btn btn-primary mx-2" (click)="addUser()">Add</button>

<hr>

<div *ngIf="editingUser">
  <h3>Edit User</h3>

  <input [(ngModel)]="editingUser.name" class="mx-2">
  <input [(ngModel)]="editingUser.username" class="mx-2">
  <input [(ngModel)]="editingUser.email" class="mx-2">
  <button class="btn btn-warning mx-2" (click)="updateUser()">Update</button>
</div>
